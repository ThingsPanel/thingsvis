name: Deploy to CLOUD

# =============================================================================
# Cloud deploy uses the historical public SSH deployment path.
# Keep the host, user, and key in GitHub Actions secrets.
# =============================================================================

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: thingsvis-deploy-cloud
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CLOUD }}
        run: npx prisma generate

      - name: Build Server + Studio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CLOUD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm turbo run build --filter=@thingsvis/server --filter=studio

      - name: Build Widgets
        run: pnpm run build:widgets

      - name: Ensure registry.json in Studio dist
        run: node scripts/generate-registry.js && cp apps/studio/public/registry.json apps/studio/dist/registry.json

      - name: Validate widget release artifacts
        run: node scripts/validate-widget-release.js apps/studio/dist/registry.json

      - name: Package artifacts
        run: |
          mkdir -p deploy/server deploy/studio deploy/widgets

          if [ -d "apps/server/.next/standalone" ]; then
            cp -r apps/server/.next/standalone/. deploy/server/
            mkdir -p deploy/server/apps/server/.next/static
            cp -r apps/server/.next/static/. deploy/server/apps/server/.next/static/
            if [ -d "apps/server/public" ]; then
              cp -r apps/server/public deploy/server/apps/server/public
            fi
            if [ -d "apps/server/prisma" ]; then
              cp -r apps/server/prisma deploy/server/apps/server/prisma
            fi
            echo "✅ Server packaged"
          else
            echo "❌ No standalone build found!"
            exit 1
          fi

          if [ -d "apps/studio/dist" ]; then
            cp -r apps/studio/dist/. deploy/studio/
            echo "✅ Studio packaged"
          else
            echo "❌ Studio dist not found!"
            exit 1
          fi

          for dir in packages/widgets/*/*/; do
            if [ -d "${dir}dist" ]; then
              rel_path="${dir#packages/widgets/}"
              rel_path="${rel_path%/}"
              mkdir -p "deploy/widgets/${rel_path}"
              cp -r "${dir}dist" "deploy/widgets/${rel_path}/"
            fi
          done
          echo "✅ Widgets packaged"

          cat > deploy/thingsvis.conf <<'EOF'
          server {
              listen 7050;
              server_name _;

              root /var/www/thingsvis-studio;
              index index.html;

              gzip on;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

              location /api/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  client_max_body_size 50m;
              }

              location ^~ /uploads/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location ^~ /widgets/ {
                  alias /var/www/thingsvis-plugins/;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          EOF

          cd deploy && tar --exclude='*.map' --exclude='**/*.map' -czf ../thingsvis-deploy.tar.gz .
          test -f ../thingsvis-deploy.tar.gz
          echo "📦 Tarball size: $(du -h ../thingsvis-deploy.tar.gz | cut -f1)"

      - name: Prepare deployment package
        id: package
        run: |
          package="thingsvis-deploy-${{ github.run_id }}.tar.gz"
          cp thingsvis-deploy.tar.gz "$package"
          echo "sha256=$(sha256sum "$package" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale for Cloud SSH fallback
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: 100.126.67.60

      - name: Stream package and deploy over one SSH connection (public, then Tailscale fallback)
        env:
          DEPLOY_PUBLIC_HOST: ${{ secrets.DEPLOY_HOST_CLOUD }}
          DEPLOY_TAILSCALE_HOST: 100.126.67.60
          DEPLOY_USER: ${{ secrets.DEPLOY_USER_CLOUD }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY_CLOUD }}
        run: |
          set -euo pipefail

          package="thingsvis-deploy-${{ github.run_id }}.tar.gz"
          package_size="$(wc -c < "$package" | tr -d ' ')"
          expected_sha="${{ steps.package.outputs.sha256 }}"
          remote_package="/tmp/$package"
          remote_dir="/tmp/thingsvis-deploy-${{ github.run_id }}"
          key_file="$RUNNER_TEMP/thingsvis-cloud-deploy-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"

          remote_command="$(cat <<'REMOTE_SCRIPT'
            set -euo pipefail

            remote_package="__REMOTE_PACKAGE__"
            remote_dir="__REMOTE_DIR__"
            package_size="__PACKAGE_SIZE__"
            expected_sha="__EXPECTED_SHA__"
            find /tmp -depth -mindepth 1 -path '/tmp/thingsvis-deploy-*' -delete
            mkdir -p "$remote_dir"
            head -c "$package_size" > "$remote_package"
            test -s "$remote_package"
            actual_sha="$(sha256sum "$remote_package" | cut -d' ' -f1)"
            test "$actual_sha" = "$expected_sha"

            export PATH="/usr/local/lib/nodejs/node-v20.19.0-linux-x64/bin:$PATH"

            echo "=== Deploying ThingsVis ==="

            mkdir -p /opt/thingsvis/server
            mkdir -p /var/www/thingsvis-studio
            mkdir -p /var/www/thingsvis-plugins

            rm -rf "$remote_dir"
            mkdir -p "$remote_dir"
            tar -xzf "$remote_package" -C "$remote_dir"

            cp "$remote_dir/thingsvis.conf" /etc/nginx/conf.d/thingsvis.conf

            echo ">>> Deploying Server..."
            pm2 stop thingsvis-server 2>/dev/null || true
            sleep 1
            rm -rf /opt/thingsvis/server/.next /opt/thingsvis/server/node_modules
            cp -rf "$remote_dir/server/." /opt/thingsvis/server/
            cd /opt/thingsvis/server

            if [ -f /opt/thingsvis/server/apps/server/.env ]; then
              set -a
              . /opt/thingsvis/server/apps/server/.env
              set +a
            elif [ -f /opt/thingsvis/server/.env ]; then
              set -a
              . /opt/thingsvis/server/.env
              set +a
            fi

            : "${DATABASE_URL:?DATABASE_URL is required for deploy-cloud}"
            : "${AUTH_SECRET:?AUTH_SECRET is required for deploy-cloud}"

            cd apps/server
            npx --yes --package=prisma@5.22.0 -- prisma db push --schema ./prisma/schema.prisma --accept-data-loss --skip-generate
            cd ../..

            NODE_ENV=production HOSTNAME=127.0.0.1 AUTH_TRUST_HOST=true PORT=8000 \
            DATABASE_URL="$DATABASE_URL" AUTH_SECRET="$AUTH_SECRET" AUTH_URL="${AUTH_URL:-http://127.0.0.1:8000}" \
            pm2 start apps/server/server.js --name thingsvis-server --update-env 2>/dev/null || \
            NODE_ENV=production HOSTNAME=127.0.0.1 AUTH_TRUST_HOST=true PORT=8000 \
            DATABASE_URL="$DATABASE_URL" AUTH_SECRET="$AUTH_SECRET" AUTH_URL="${AUTH_URL:-http://127.0.0.1:8000}" \
            pm2 restart thingsvis-server --update-env
            pm2 save

            echo ">>> Deploying Studio..."
            rm -rf /var/www/thingsvis-studio/*
            cp -rf "$remote_dir/studio/." /var/www/thingsvis-studio/

            echo ">>> Deploying Widgets..."
            if [ -d "$remote_dir/widgets" ] && [ "$(ls -A "$remote_dir/widgets" 2>/dev/null)" ]; then
              mkdir -p /var/www/thingsvis-plugins
              cp -rf "$remote_dir/widgets/." /var/www/thingsvis-plugins/
            fi

            nginx -t && systemctl reload nginx

            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/api/v1/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "ThingsVis server health check failed" >&2
                pm2 describe thingsvis-server >&2 || true
                exit 1
              fi
              sleep 2
            done
            curl -fsS --max-time 5 http://127.0.0.1:7050/ >/dev/null

            rm -rf "$remote_dir" "$remote_package"

            echo ""
            echo "=== Deployment complete ==="
            pm2 list
            echo ""
            echo "🔗 Studio:  http://__DEPLOY_HOST__:7050/"
          REMOTE_SCRIPT
          )"
          remote_command="${remote_command//__REMOTE_PACKAGE__/$remote_package}"
          remote_command="${remote_command//__REMOTE_DIR__/$remote_dir}"
          remote_command="${remote_command//__PACKAGE_SIZE__/$package_size}"
          remote_command="${remote_command//__EXPECTED_SHA__/$expected_sha}"
          remote_command="${remote_command//__DEPLOY_HOST__/$DEPLOY_PUBLIC_HOST}"

          ssh_options=(
            -i "$key_file" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10
          )

          echo "📦 Streaming $package ($(du -h "$package" | cut -f1)) over one SSH connection"
          if ! cat "$package" | ssh "${ssh_options[@]}" \
            "$DEPLOY_USER@$DEPLOY_PUBLIC_HOST" \
            "$remote_command"; then
            echo "⚠️ Public SSH unavailable; retrying the same deployment over Tailscale"
            cat "$package" | ssh "${ssh_options[@]}" \
              "$DEPLOY_USER@$DEPLOY_TAILSCALE_HOST" \
              "$remote_command"
          fi
