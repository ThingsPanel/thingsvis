name: Deploy to E

# =============================================================================
# 所需 Secrets 清单（请在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置）
# =============================================================================
# 1. DATABASE_URL_E        — 数据库连接地址，格式如 mysql://user:password@host:3306/dbname
# 2. AUTH_SECRET         — 认证加密密钥，用于 session / JWT 签名，建议 32+ 位随机字符串
# 3. TS_OAUTH_CLIENT_ID    — Tailscale GitHub OIDC client id
# 4. TS_OAUTH_SECRET       — Tailscale GitHub OIDC secret
# =============================================================================

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: thingsvis-deploy-e
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          ping: 100.105.12.123

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

# ========================================
      # Build all packages via turbo
      # ========================================
      # DATABASE_URL_E: 数据库连接地址（如 mysql://user:pass@host:3306/thingsvis）
      - name: Generate Prisma Client
        working-directory: apps/server
        env:
          DATABASE_URL_E: ${{ secrets.DATABASE_URL_E }}
        run: npx prisma generate

      # DATABASE_URL_E: 数据库连接地址
      # AUTH_SECRET: 认证加密密钥（用于 session/token 签名，建议 32+ 字符随机字符串）
      - name: Build Server + Studio
        env:
          DATABASE_URL_E: ${{ secrets.DATABASE_URL_E }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm turbo run build --filter=@thingsvis/server --filter=studio


      - name: Build Widgets
        run: pnpm run build:widgets

      - name: Ensure registry.json in Studio dist
        run: node scripts/generate-registry.js && cp apps/studio/public/registry.json apps/studio/dist/registry.json

      - name: Validate widget release artifacts
        run: node scripts/validate-widget-release.js apps/studio/dist/registry.json

      # ========================================
      # Package artifacts
      # ========================================
      - name: Package artifacts
        run: |
          mkdir -p deploy/server deploy/studio deploy/widgets

          # --- Server: Next.js standalone ---
          if [ -d "apps/server/.next/standalone" ]; then
            cp -r apps/server/.next/standalone/. deploy/server/
            mkdir -p deploy/server/apps/server/.next/static
            cp -r apps/server/.next/static/. deploy/server/apps/server/.next/static/
            if [ -d "apps/server/public" ]; then
              cp -r apps/server/public deploy/server/apps/server/public
            fi

            # Copy prisma directory for migrations
            if [ -d "apps/server/prisma" ]; then
              cp -r apps/server/prisma deploy/server/apps/server/prisma
            fi

            echo "✅ Server packaged"
          else
            echo "❌ No standalone build found!"
            exit 1
          fi

          # --- Studio: static SPA ---
          if [ -d "apps/studio/dist" ]; then
            cp -r apps/studio/dist/. deploy/studio/
            echo "✅ Studio packaged"
          else
            echo "❌ Studio dist not found!"
            exit 1
          fi



          # --- Widgets (two-level: packages/widgets/category/name/dist) ---
          for dir in packages/widgets/*/*/; do
            if [ -d "${dir}dist" ]; then
              rel_path="${dir#packages/widgets/}"
              rel_path="${rel_path%/}"
              mkdir -p "deploy/widgets/${rel_path}"
              cp -r "${dir}dist" "deploy/widgets/${rel_path}/"
            fi
          done
          echo "✅ Widgets packaged"

          # --- Config ---
          cat > deploy/thingsvis.conf <<'EOF'
          server {
              listen 7050;
              server_name _;

              root /var/www/thingsvis-studio;
              index index.html;

              gzip on;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

              location /api/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  client_max_body_size 50m;
              }

                location ^~ /uploads/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

                location ^~ /widgets/ {
                  alias /var/www/thingsvis-plugins/;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          EOF

          # Create tarball
          cd deploy && tar -czf ../thingsvis-deploy.tar.gz .
          test -f ../thingsvis-deploy.tar.gz
          echo "📦 Tarball size: $(du -h ../thingsvis-deploy.tar.gz | cut -f1)"

      - name: Upload to server via Tailscale SSH
        env:
          REMOTE_PACKAGE: /tmp/thingsvis-deploy-${{ github.run_id }}.tar.gz
        run: |
          set -euo pipefail
          remote_part="${REMOTE_PACKAGE}.part"
          tailscale ssh "root@100.105.12.123" \
            "cat > '$remote_part' && mv '$remote_part' '$REMOTE_PACKAGE'" \
            < thingsvis-deploy.tar.gz

          expected_sha="$(sha256sum thingsvis-deploy.tar.gz | cut -d' ' -f1)"
          actual_sha="$(tailscale ssh "root@100.105.12.123" \
            "sha256sum '$REMOTE_PACKAGE' | cut -d' ' -f1")"
          test "$actual_sha" = "$expected_sha"

      - name: Deploy and restart services via Tailscale SSH
        run: |
          tailscale ssh "root@100.105.12.123" 'bash -s' <<'REMOTE_SCRIPT'
            set -euo pipefail

            remote_package="/tmp/thingsvis-deploy-${{ github.run_id }}.tar.gz"
            remote_dir="/tmp/thingsvis-deploy-${{ github.run_id }}"
            expected_sha="${{ steps.package.outputs.sha256 }}"
            test -s "$remote_package"
            actual_sha="$(sha256sum "$remote_package" | cut -d' ' -f1)"
            test "$actual_sha" = "$expected_sha"

            export PATH="/usr/local/lib/nodejs/node-v16.14.2-linux-x64/bin:$PATH"

            echo "=== Deploying ThingsVis ==="

            # Ensure directories exist
            mkdir -p /opt/thingsvis/server
            mkdir -p /var/www/thingsvis-studio

            mkdir -p /var/www/thingsvis-plugins

            # Extract
            rm -rf "$remote_dir"
            mkdir -p "$remote_dir"
            tar -xzf "$remote_package" -C "$remote_dir"

            # --- Deploy Nginx Config ---
            cp "$remote_dir/thingsvis.conf" /etc/nginx/conf.d/thingsvis.conf
            
            # --- Deploy Server ---
            echo ">>> Deploying Server..."
            pm2 stop thingsvis-server 2>/dev/null || true
            sleep 1
            rm -rf /opt/thingsvis/server/.next /opt/thingsvis/server/node_modules
            cp -rf "$remote_dir/server/." /opt/thingsvis/server/
            cd /opt/thingsvis/server

            # Source .env if exists
            if [ -f /opt/thingsvis/server/.env ]; then
              export $(grep -v '^#' /opt/thingsvis/server/.env | xargs)
            fi

            # Apply database migrations
            cd apps/server
            npx --yes --package=prisma@5.22.0 -- prisma db push --schema ./prisma/schema.prisma --accept-data-loss --skip-generate
            cd ../..

            NODE_ENV=production HOSTNAME=127.0.0.1 AUTH_TRUST_HOST=true PORT=8000 pm2 start apps/server/server.js --name thingsvis-server --update-env 2>/dev/null || \
            NODE_ENV=production HOSTNAME=127.0.0.1 AUTH_TRUST_HOST=true PORT=8000 pm2 restart thingsvis-server --update-env
            pm2 save

            # --- Deploy Studio ---
            echo ">>> Deploying Studio..."
            rm -rf /var/www/thingsvis-studio/*
            cp -rf "$remote_dir/studio/." /var/www/thingsvis-studio/



            # --- Deploy Widgets ---
            echo ">>> Deploying Widgets..."
            if [ -d "$remote_dir/widgets" ] && [ "$(ls -A "$remote_dir/widgets" 2>/dev/null)" ]; then
              mkdir -p /var/www/thingsvis-plugins
              cp -rf "$remote_dir/widgets/." /var/www/thingsvis-plugins/
            fi

            # Reload nginx
            nginx -t && systemctl reload nginx

            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/api/v1/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "ThingsVis server health check failed" >&2
                pm2 describe thingsvis-server >&2 || true
                exit 1
              fi
              sleep 2
            done
            curl -fsS --max-time 5 http://127.0.0.1:7050/ >/dev/null

            # Cleanup
            rm -rf "$remote_dir" "$remote_package"

            echo ""
            echo "=== Deployment complete ==="
            pm2 list
            echo ""
            echo "🔗 Studio:  http://100.105.12.123:7050/"
          REMOTE_SCRIPT
